<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sabri Style</title>
<meta name="description" content="Teste coupes, barbes et moustaches sur ton modèle 3D.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="viewer"></div>
<div id="loading">Chargement de ton modèle…</div>

<header class="top">
  <b class="brand">Sabri Style</b>
  <div class="top-actions">
    <button id="barberBtn" class="icon" title="À dire au barbier">✂️</button>
    <button id="favBtn" class="icon" title="Garder ce look">♡</button>
  </div>
</header>

<div class="look" id="lookName">Mon look actuel</div>

<section class="sheet">
  <nav class="seg" id="seg">
    <button data-tab="looks" class="on">Looks</button>
    <button data-tab="beard">Barbe</button>
    <button data-tab="must">Moustache</button>
    <button data-tab="hair">Cheveux</button>
  </nav>
  <div class="tab on" id="t-looks"><div class="row" id="looks"></div></div>
  <div class="tab" id="t-beard"><div class="row" id="beard"></div></div>
  <div class="tab" id="t-must"><div class="row" id="must"></div></div>
  <div class="tab" id="t-hair">
    <div class="row" id="hair"></div>
    <div class="row" id="fade"></div>
  </div>
</section>

<dialog id="barber">
  <h3>À dire au barbier</h3>
  <p id="barberText"></p>
  <div class="dlg-actions">
    <button id="copyBarber" class="primary">Copier</button>
    <button id="closeBarber">Fermer</button>
  </div>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
